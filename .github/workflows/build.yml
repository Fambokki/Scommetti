name: Compila IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma, la firma la fa Sideloadly)
        run: |
          xcodebuild -project Scommetti.xcodeproj -target Scommetti \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Crea il file IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Scommetti.app Payload/
          zip -qry Scommetti.ipa Payload

      - name: Carica come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Scommetti-ipa
          path: Scommetti.ipa

      - name: Pubblica nella pagina Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scommetti build ${{ github.run_number }}
          files: Scommetti.ipa
